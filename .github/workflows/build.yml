name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Repository quality gate
        shell: pwsh
        run: ./scripts/check.ps1

  arm64-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: ARM64 compile and package validation
        shell: pwsh
        run: ./scripts/check.ps1 -Runtime win-arm64 -Platform ARM64 -BuildOnly
